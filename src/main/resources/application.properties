quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgresql:5432/coolstore}
quarkus.datasource.username=${DB_USER:coolstore}
quarkus.datasource.password=${DB_PASSWORD:changeme}
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Reactive messaging: in-memory channels (orders: Emitter -> @Incoming). inventory: fed by order processor (Emitter).
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:5170}
audit.stream.protocol=${AUDIT_STREAM_PROTOCOL:TCP}
