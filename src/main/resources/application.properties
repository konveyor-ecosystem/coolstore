quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://coolstore-postgresql:5432/coolstore}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Messaging [D2]: in-memory channel "orders" (emitter -> @Incoming in same app, no connector needed)
# %amqp profile (optional, requires quarkus-messaging-amqp):
# %amqp: add quarkus-messaging-amqp and split into orders-out/orders-in channels with connector=smallrye-amqp, address=orders (documented option, not active)
coolstore.audit.enabled=${COOLSTORE_AUDIT_ENABLED:false}
coolstore.audit.stream-host=${AUDIT_STREAM_HOST:localhost}
coolstore.audit.stream-port=${AUDIT_STREAM_PORT:9000}
quarkus.oidc.tenant-enabled=false
quarkus.smallrye-health.root-path=/q/health
%test.coolstore.audit.enabled=false
