apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore-monolith
  labels: {app: coolstore-monolith}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: coolstore-monolith}
  template:
    metadata:
      labels: {app: coolstore-monolith}
    spec:
      # Pod security: non-root, RuntimeDefault seccomp (restricted-v2 compatible)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolstore-monolith
          image: image-registry.openshift-image-registry.svc:5000/coolstore/coolstore-monolith:latest
          # Container security: no privilege escalation, all capabilities dropped, read-only rootfs
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 185
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports: [{containerPort: 8080, name: http, protocol: TCP}]
          envFrom:
            - configMapRef: {name: coolstore-config}
            - secretRef: {name: coolstore-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /q/health/started, port: 8080}
            failureThreshold: 30
            periodSeconds: 2
          # Writable paths for the read-only root filesystem
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
