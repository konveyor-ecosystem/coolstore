# CoolStore on OpenShift — Keycloak (OIDC identity provider, realm "eap").
# Apply after secret.yaml (uses keycloak-admin).
#
# PREREQUISITE — the `keycloak-realm` ConfigMap. The realm definition
# (realm-export.json, ~59 KB, repo root) is NOT inlined here; create it first:
#
#   oc create configmap keycloak-realm \
#     --from-file=realm-export.json=realm-export.json
#
# Keycloak starts with `start --import-realm`, importing the `eap` realm
# (public client `eap-app`) from the mounted realm-export.json on boot.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: coolstore
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: identity-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: coolstore
        app.kubernetes.io/component: identity-provider
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start", "--import-realm"]
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Edge-terminated Route in front → trust router X-Forwarded-* so
            # auth redirects use the public https:// route hostname.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management # health endpoints (see probes)
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
            items:
              - key: realm-export.json
                path: realm-export.json
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: coolstore
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Edge-terminated TLS; OpenShift generates the public hostname automatically.
# The browser-facing SPA must point at THIS route (see CONTAINERIZATION_REPORT.md
# — known issue: META-INF/resources/keycloak.json still defaults to localhost).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: coolstore
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
spec:
  to:
    kind: Service
    name: keycloak
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
