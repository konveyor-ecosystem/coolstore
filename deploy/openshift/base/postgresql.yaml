apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: coolstore-db-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coolstore-db, labels: {app: coolstore-db}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: coolstore-db}}
  template:
    metadata: {labels: {app: coolstore-db}}
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports: [{containerPort: 5432, name: postgresql}]
          env:
            - {name: POSTGRESQL_USER, valueFrom: {secretKeyRef: {name: coolstore-db, key: database-user}}}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: coolstore-db, key: database-password}}}
            - {name: POSTGRESQL_DATABASE, valueFrom: {secretKeyRef: {name: coolstore-db, key: database-name}}}
          readinessProbe: {exec: {command: ["/usr/libexec/check-container"]}, initialDelaySeconds: 5}
          livenessProbe: {exec: {command: ["/usr/libexec/check-container", "--live"]}, initialDelaySeconds: 120}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/pgsql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: coolstore-db-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: coolstore-db}
spec:
  selector: {app: coolstore-db}
  ports: [{name: postgresql, port: 5432, targetPort: 5432}]
