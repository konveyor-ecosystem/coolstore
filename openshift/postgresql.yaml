# CoolStore on OpenShift — PostgreSQL database.
#
# Deployment order (dependencies):
#   1. openshift/postgresql.yaml   — this file (apply first)
#   2. openshift/amq-broker.yaml   — JMS broker
#   3. openshift/keycloak.yaml     — OIDC identity provider
#   4. openshift/coolstore-quarkus.yaml — the application
#
# One-shot:  oc apply -f openshift/
#
# The application connects with the credentials in secret `coolstore-db`
# (openshift/coolstore-quarkus.yaml) — keep them in sync with this secret.
#
# NOTE: this manifest uses POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
# The Red Hat rhel9/postgresql-16 image also accepts the aliases
# POSTGRESQL_USER / POSTGRESQL_PASSWORD / POSTGRESQL_DATABASE; if the database
# fails to initialize, rename the keys in the Secret accordingly.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-creds
  namespace: coolstore
  labels:
    app: postgresql
type: Opaque
stringData:
  POSTGRES_USER: coolstore
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: coolstore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: coolstore
  labels:
    app: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: coolstore
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  strategy:
    type: Recreate # single writer bound to an RWO volume
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: coolstore
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: registry.access.redhat.com/rhel9/postgresql-16:latest
          # Subdirectory mount so volume-root lost+found doesn't break init.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/db
          envFrom:
            - secretRef:
                name: postgresql-creds
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: coolstore
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
