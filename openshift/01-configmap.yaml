# Non-sensitive application configuration for the coolstore monolith
apiVersion: v1
kind: ConfigMap
metadata:
  name: coolstore-config
  namespace: coolstore
  labels:
    app: coolstore
data:
  # PostgreSQL connection (Service created by 03-postgres.yaml)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "coolstore"
  # Keycloak auth server for the SPA's client-side OIDC adapter
  # (was hardcoded to http://localhost:8081/ in src/main/webapp/keycloak.json)
  # NOTE: overwritten by scripts/deploy-openshift.sh with the external
  # https:// URL of the Keycloak Route (08-keycloak-route.yaml) before the
  # application is deployed — the browser cannot reach in-cluster service DNS.
  KEYCLOAK_AUTH_SERVER_URL: "http://keycloak:8080/"
