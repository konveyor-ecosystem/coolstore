apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: coolstore}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: coolstore}
  minReplicas: 1
  maxReplicas: 1   # raise only after carts/messaging are externalized (Data Grid / AMQ)
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
