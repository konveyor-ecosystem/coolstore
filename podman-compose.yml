# Local development environment for CoolStore (mirrors the OpenShift deployment).
#
#   podman-compose up -d          # start everything
#   podman-compose logs -f coolstore
#   podman-compose down -v        # stop and reset data
#
# The app is served at http://localhost:8080 (catalog is public; cart/orders
# require a Keycloak login). Credentials below are DEV-ONLY — production uses
# the Secrets from secret.yaml.
#
# Note: no audit collector is included — the app's StreamableAuditLogger points
# at "audit-collector:1514" and audit events are dropped locally. Point
# AUDIT_LOGGER_TCP_HOST/PORT at any TCP listener (e.g. `nc -lk 1514`) to inspect.
version: "3.8"

services:
  coolstore:
    build:
      context: .
      dockerfile: Dockerfile
    image: quay.io/coolstore/coolstore-quarkus:latest
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/coolstore
      QUARKUS_DATASOURCE_USERNAME: coolstore
      QUARKUS_DATASOURCE_PASSWORD: coolstore
      QUARKUS_ARTEMIS_URL: tcp://amq-broker:61616
      QUARKUS_ARTEMIS_USERNAME: coolstore
      QUARKUS_ARTEMIS_PASSWORD: coolstore
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/eap
      AUDIT_LOGGER_TCP_HOST: audit-collector
      AUDIT_LOGGER_TCP_PORT: "1514"
    depends_on:
      - postgresql
      - amq-broker
      - keycloak

  postgresql:
    image: registry.access.redhat.com/rhel9/postgresql-16:latest
    environment:
      POSTGRES_USER: coolstore
      POSTGRES_PASSWORD: coolstore
      POSTGRES_DB: coolstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  amq-broker:
    image: quay.io/artemiscloud/activemq-artemis-broker:latest
    environment:
      AMQ_USER: coolstore
      AMQ_PASSWORD: coolstore
      AMQ_PROTOCOLS: "core,openwire"
      AMQ_ADDRESSES: "topic/orders"
      AMQ_ENABLE_ANALYTICS: "false"
    ports:
      - "61616:61616"
    volumes:
      - amq-journal:/opt/activemq-artemis-broker/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
  amq-journal:
