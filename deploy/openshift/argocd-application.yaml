apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coolstore-quarkus
  namespace: openshift-gitops
  labels:
    app: coolstore-quarkus
spec:
  project: default
  source:
    repoURL: https://github.com/konveyor-ecosystem/coolstore.git
    targetRevision: konveyor/migration-1794838418
    path: deploy/openshift
  destination:
    server: https://kubernetes.default.svc
    namespace: coolstore-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
