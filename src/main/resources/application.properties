# ---- HTTP / REST ----
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ---- Datasource (PostgreSQL, configured through env vars) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coolstore}
quarkus.datasource.username=${DB_USERNAME:coolstore}
quarkus.datasource.password=${DB_PASSWORD:coolstore}
quarkus.datasource.devservices.enabled=false

# ---- Hibernate ORM ----
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---- Flyway (replaces DataBaseMigrationStartup) ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# ---- Messaging: in-memory "orders" channel (emitter -> 2 @Incoming consumers, @Broadcast) ----
# To move to a broker, set e.g. mp.messaging.outgoing.orders.connector=smallrye-amqp (+ quarkus-messaging-amqp)

# ---- OIDC (Keycloak realm eap), opt-in via OIDC_ENABLED ----
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081}/realms/eap
quarkus.oidc.client-id=eap-app
quarkus.oidc.devservices.enabled=false
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit

# ---- Audit logging library 2.0.0 (TCP stream) ----
audit.enabled=${AUDIT_ENABLED:true}
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:5170}

# ---- Test profile: H2 in PostgreSQL mode, no Docker/Dev Services ----
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.audit.stream.port=5999
