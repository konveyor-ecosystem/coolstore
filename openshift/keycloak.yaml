# Keycloak 26 (OIDC identity provider, realm "eap" imported from realm-export.json).
# Admin credentials externalized to the coolstore-secrets Secret (was hardcoded admin/admin).
# NOTE: keycloak-realm ConfigMap must be created from realm-export.json first:
#   oc create configmap keycloak-realm --from-file=realm-export.json=realm-export.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {app: keycloak}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: coolstore-secrets, key: KEYCLOAK_ADMIN}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: coolstore-secrets, key: KEYCLOAK_ADMIN_PASSWORD}}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  selector: {app: keycloak}
  ports: [{name: http, port: 80, targetPort: 8080}]
