# --- CoolStore Quarkus configuration (externalized via env vars for OpenShift) ---

# Datasource (PostgreSQL) - replaces java:jboss/datasources/CoolstoreDS
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:coolstore}
quarkus.datasource.jdbc.url=jdbc:postgresql://${QUARKUS_DATASOURCE_HOST:localhost}:${QUARKUS_DATASOURCE_PORT:5432}/${QUARKUS_DATASOURCE_DATABASE:coolstore}

# Hibernate ORM - schema is managed by Flyway, never by Hibernate
quarkus.hibernate-orm.database.generation=none

# Flyway - runs db/migration/V1_1__CreateSchema.sql + V1_2__AddInitialData.sql on startup.
# baseline-on-migrate allows bootstrapping against the existing EAP-era database unchanged.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.2

# REST - preserve the /services base path (@ApplicationPath also kept in RestApplication)
quarkus.rest.path=/services

# OIDC (Keycloak realm "eap", public client "eap-app") - replaces the Keycloak JS/server adapter config
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/eap
quarkus.oidc.client-id=eap-app
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=eap-app

# HTTP security: static assets and catalog/cart browsing are public; checkout + orders require auth
quarkus.http.auth.permission.public.paths=/,/q/*,/services/products/*,/services/cart/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.secured.paths=/services/cart/checkout/*,/services/orders/*
quarkus.http.auth.permission.secured.policy=authenticated

# AMQP messaging - replaces JMS topic/orders (fan-out to both consumers via broadcast)
amqp-host=${AMQP_HOST:localhost}
amqp-port=${AMQP_PORT:5672}
amqp-username=${AMQP_USERNAME:artemis}
amqp-password=${AMQP_PASSWORD:artemis}
mp.messaging.outgoing.orders.connector=smallrye-amqp
mp.messaging.outgoing.orders.address=orders
mp.messaging.outgoing.orders.durable=true
mp.messaging.incoming.orders.connector=smallrye-amqp
mp.messaging.incoming.orders.address=orders
mp.messaging.incoming.orders.broadcast=true
mp.messaging.incoming.orders.durable=true

# Audit logging (audit-logging-library 2.0.0, StreamableAuditLogger over TCP)
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:4560}
audit.stream.protocol=${AUDIT_STREAM_PROTOCOL:tcp}

mp.messaging.outgoing.orders.use-anonymous-sender=false
