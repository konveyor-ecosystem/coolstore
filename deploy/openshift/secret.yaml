# NOTE: Replace placeholder values with actual secrets before applying.
# Use: oc create secret generic coolstore-quarkus-secret --from-literal=...
# Or use OpenShift Vault / ESO integration to manage secrets.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-quarkus-secret
  namespace: coolstore-dev
  labels:
    app: coolstore-quarkus
type: Opaque
stringData:
  # Database credentials (provided by PostgreSQL operator / CrunchyData PGO)
  DB_URL: "jdbc:postgresql://coolstore-db-primary.coolstore-dev.svc:5432/coolstoredb"
  DB_USERNAME: "coolstore"
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  # AMQ Broker credentials (provided by AMQ Broker Operator)
  AMQP_HOST: "coolstore-amq-broker-hdls-svc.coolstore-dev.svc"
  AMQP_PORT: "5672"
  AMQP_USERNAME: "admin"
  AMQP_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  # Keycloak OIDC credentials (provided by Keycloak Operator / RHSSO)
  OIDC_AUTH_SERVER_URL: "https://keycloak.coolstore-dev.apps.cluster.example.com/realms/coolstore"
  OIDC_CLIENT_ID: "coolstore"
  OIDC_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_SECRET"
  # Session encryption key
  SESSION_ENCRYPTION_KEY: "REPLACE_WITH_32_CHAR_RANDOM_KEY"
