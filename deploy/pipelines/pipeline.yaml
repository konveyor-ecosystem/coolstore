apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: coolstore-build-deploy
  namespace: coolstore-dev
  labels:
    app: coolstore
    component: pipeline
spec:
  description: |
    CI/CD pipeline for the CoolStore Quarkus application.
    Stages: git-clone → maven-build → image-build → image-scan → deploy-dev

  params:
    - name: git-url
      type: string
      description: Git repository URL
      default: https://github.com/konveyor-ecosystem/coolstore.git

    - name: git-revision
      type: string
      description: Git revision (branch, tag, or commit SHA)
      default: konveyor/migration-1794838418

    - name: image-name
      type: string
      description: Fully-qualified container image name (registry/org/name)
      default: quay.io/coolstore/coolstore-quarkus

    - name: image-tag
      type: string
      description: Container image tag
      default: latest

    - name: maven-goals
      type: array
      description: Maven goals to execute
      default:
        - package
        - "-DskipTests=false"

    - name: deploy-namespace
      type: string
      description: Target OpenShift/Kubernetes namespace for dev deployment
      default: coolstore-dev

  workspaces:
    - name: source
      description: Workspace holding the cloned source code
    - name: maven-cache
      description: Local Maven repository cache
    - name: docker-credentials
      description: OCI registry credentials (Secret mounted as workspace)

  tasks:
    # -------------------------------------------------------------------------
    # Task 1: git-clone
    # -------------------------------------------------------------------------
    - name: git-clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: git-clone
          - name: namespace
            value: tekton-tasks
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"

    # -------------------------------------------------------------------------
    # Task 2: maven-build
    # -------------------------------------------------------------------------
    - name: maven-build
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: maven
          - name: namespace
            value: tekton-tasks
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: source
        - name: maven-settings
          workspace: maven-cache
      params:
        - name: GOALS
          value: $(params.maven-goals[*])
        - name: CONTEXT_DIR
          value: coolstore-quarkus

    # -------------------------------------------------------------------------
    # Task 3: image-build  (Buildah)
    # -------------------------------------------------------------------------
    - name: image-build
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: buildah
          - name: namespace
            value: tekton-tasks
      runAfter:
        - maven-build
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: $(params.image-name):$(params.image-tag)
        - name: CONTEXT
          value: coolstore-quarkus
        - name: DOCKERFILE
          value: coolstore-quarkus/Containerfile.jvm
        - name: TLSVERIFY
          value: "true"

    # -------------------------------------------------------------------------
    # Task 4: image-scan  (Trivy)
    # -------------------------------------------------------------------------
    - name: image-scan
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: trivy-scanner
          - name: namespace
            value: tekton-tasks
      runAfter:
        - image-build
      params:
        - name: IMAGE
          value: $(params.image-name):$(params.image-tag)
        - name: EXIT_CODE
          value: "1"
        - name: SEVERITY
          value: HIGH,CRITICAL

    # -------------------------------------------------------------------------
    # Task 5: deploy-dev  (kubectl / oc apply)
    # -------------------------------------------------------------------------
    - name: deploy-dev
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: openshift-client
          - name: namespace
            value: tekton-tasks
      runAfter:
        - image-scan
      workspaces:
        - name: manifest-dir
          workspace: source
      params:
        - name: SCRIPT
          value: |
            oc set image deployment/coolstore-quarkus \
              coolstore-quarkus=$(params.image-name):$(params.image-tag) \
              -n $(params.deploy-namespace)
            oc rollout status deployment/coolstore-quarkus \
              -n $(params.deploy-namespace) \
              --timeout=180s

  # ---------------------------------------------------------------------------
  # Finally: notify on completion (optional — no-op if task not installed)
  # ---------------------------------------------------------------------------
  finally:
    - name: notify-slack
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: send-to-webhook-slack
          - name: namespace
            value: tekton-tasks
      params:
        - name: webhook-secret
          value: slack-webhook-secret
        - name: message
          value: "CoolStore pipeline finished. Image: $(params.image-name):$(params.image-tag)"
