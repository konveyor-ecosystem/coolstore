services:
  db:
    image: registry.redhat.io/rhel9/postgresql-15
    environment: {POSTGRESQL_USER: coolstore, POSTGRESQL_PASSWORD: coolstore, POSTGRESQL_DATABASE: coolstore}
    ports: ["5432:5432"]
  app:
    build: {context: ., dockerfile: Containerfile}
    environment: {DB_HOST: db, DB_USERNAME: coolstore, DB_PASSWORD: coolstore, DB_NAME: coolstore}
    ports: ["8080:8080"]
    depends_on: [db]
