# Datasource configuration (replaces persistence.xml)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.jdbc-warnings=true

# Flyway migration
quarkus.flyway.migrate-at-start=true

# SmallRye Reactive Messaging - In-Memory Connector
mp.messaging.outgoing.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.connector=smallrye-in-memory

# Application settings
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# RESTEasy Reactive
quarkus.resteasy-reactive.path=/services
