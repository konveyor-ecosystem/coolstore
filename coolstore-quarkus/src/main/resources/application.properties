# =============================================================================
# CoolStore Quarkus - Application Configuration
# Migrated from JBoss EAP / WebLogic monolith to Quarkus 3.6.4
# Secrets are externalized via environment variables (no hardcoded credentials)
# =============================================================================

# Application
quarkus.application.name=coolstore-quarkus
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# Datasource
# dev profile  → H2 in-memory (no external DB required)
# prod profile → PostgreSQL (credentials supplied via env vars)
# ---------------------------------------------------------------------------
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/coolstoredb}
%prod.quarkus.datasource.username=${DB_USERNAME:coolstore}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
# Disable auto-migration in dev; use Flyway CLI or Dev Services instead
%dev.quarkus.flyway.migrate-at-start=false

# ---------------------------------------------------------------------------
# OIDC / Keycloak
# Replaces keycloak.json adapter config from the EAP monolith.
# OIDC is disabled in dev profile to allow unauthenticated local testing.
# ---------------------------------------------------------------------------
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/coolstore}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:coolstore}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:coolstore-secret}
quarkus.oidc.application-type=service
%dev.quarkus.oidc.enabled=false

# ---------------------------------------------------------------------------
# SmallRye Reactive Messaging - AMQP
# Replaces JMS/MDB (InventoryNotificationMDB, OrderServiceMDB)
# weblogic.jndi.WLInitialContextFactory references have been removed.
# ---------------------------------------------------------------------------
mp.messaging.connector.smallrye-amqp.host=${AMQP_HOST:localhost}
mp.messaging.connector.smallrye-amqp.port=${AMQP_PORT:5672}
mp.messaging.connector.smallrye-amqp.username=${AMQP_USERNAME:admin}
mp.messaging.connector.smallrye-amqp.password=${AMQP_PASSWORD}

# Outgoing channel - orders
mp.messaging.outgoing.orders.connector=smallrye-amqp
mp.messaging.outgoing.orders.address=topic/orders
mp.messaging.outgoing.orders.durable=true

# Incoming channel - orders (OrderServiceMDB replacement)
mp.messaging.incoming.orders.connector=smallrye-amqp
mp.messaging.incoming.orders.address=topic/orders
mp.messaging.incoming.orders.durable=true
mp.messaging.incoming.orders.group-id=order-service

# Incoming channel - orders-inventory (InventoryNotificationMDB replacement)
mp.messaging.incoming.orders-inventory.connector=smallrye-amqp
mp.messaging.incoming.orders-inventory.address=topic/orders
mp.messaging.incoming.orders-inventory.durable=true
mp.messaging.incoming.orders-inventory.group-id=inventory-notification

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ---------------------------------------------------------------------------
# Health
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health

# ---------------------------------------------------------------------------
# Metrics (Micrometer + Prometheus)
# ---------------------------------------------------------------------------
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# ---------------------------------------------------------------------------
# HTTP session encryption key for @SessionScoped (CDI)
# MUST be overridden in production via SESSION_ENCRYPTION_KEY env var.
# ---------------------------------------------------------------------------
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:ThisIsADefaultKeyThatShouldBeChanged}

# ---------------------------------------------------------------------------
# Audit log directory
# ---------------------------------------------------------------------------
audit.log.directory=${AUDIT_LOG_DIR:./device-inventory-audit-logs}
