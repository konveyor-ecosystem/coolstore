# CoolStore Quarkus configuration - externalized, no secrets in source
# Datasource (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:coolstore}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coolstore}
# Hibernate ORM (replaces META-INF/persistence.xml)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format=true
# Flyway (replaces DataBaseMigrationStartup EJB; V1_1/V1_2 migrations)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
# Artemis JMS broker
quarkus.artemis.url=${QUARKUS_ARTEMIS_URL:tcp://localhost:61616}
quarkus.artemis.username=${QUARKUS_ARTEMIS_USERNAME:artemis}
quarkus.artemis.password=${QUARKUS_ARTEMIS_PASSWORD:artemis}
# REST base path (replaces RestApplication @ApplicationPath("/services"))
quarkus.rest.path=/services
# Keycloak OIDC bearer validation (realm eap, public client eap-app)
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/eap}
quarkus.oidc.client-id=eap-app
quarkus.oidc.application-type=service
# Security: anonymous public catalog browsing; authenticated cart/orders
quarkus.http.auth.permission.public.paths=/services/products*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.services.paths=/services/*
quarkus.http.auth.permission.services.policy=authenticated
# Orders topic + consumer registration flag (Artemis topic/orders)
orders.topic.name=topic/orders
orders.consumers.enabled=true
# Audit logging (StreamableAuditLogger over TCP, library 2.0.0)
audit.logger.tcp.host=${AUDIT_LOGGER_TCP_HOST:localhost}
audit.logger.tcp.port=${AUDIT_LOGGER_TCP_PORT:1514}
# JSON structured logs to stdout for container log aggregation
quarkus.log.console.json=true
# --- Test profile: in-memory H2 (PostgreSQL mode), no broker/OIDC/auth ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.baseline-on-migrate=false
%test.orders.consumers.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.http.auth.permission.services.policy=permit
%test.quarkus.log.console.json=false
