# External HTTPS access (OpenShift) — TLS terminated at the edge, HTTP redirected
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coolstore
  namespace: coolstore
  labels:
    app: coolstore
spec:
  to:
    kind: Service
    name: coolstore
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
