# CoolStore on OpenShift — PostgreSQL 16 database (catalog, inventory, orders).
# StatefulSet with a volumeClaimTemplate: stable identity + stable storage.
# Apply after secret.yaml (uses postgresql-creds).
# The app connects with the credentials in secret `coolstore-db` — keep in sync.
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: coolstore
  labels:
    app: postgresql
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: coolstore
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: coolstore
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.access.redhat.com/rhel9/postgresql-16:latest
          # Subdirectory mount so volume-root lost+found doesn't break init.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/db
          envFrom:
            - secretRef:
                name: postgresql-creds
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
