# Template only - create the real Secret with: oc create secret generic coolstore-secrets --from-literal=...
# or: oc apply -f openshift/secret.example.yaml (after replacing CHANGE_ME values)
# Never commit real credentials (replaces README postgresUser/postgresPW).
# All values referenced by deployment.yaml, postgresql.yaml, keycloak.yaml, broker.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-secrets
  labels: {app: coolstore-monolith}
type: Opaque
stringData:
  # Application -> PostgreSQL
  QUARKUS_DATASOURCE_USERNAME: coolstore
  QUARKUS_DATASOURCE_PASSWORD: CHANGE_ME
  # PostgreSQL container (must match the datasource credentials above)
  POSTGRESQL_USER: coolstore
  POSTGRESQL_PASSWORD: CHANGE_ME
  # Application -> AMQP broker
  AMQP_USERNAME: artemis
  AMQP_PASSWORD: CHANGE_ME
  # Artemis broker container (must match the AMQP credentials above)
  AMQ_USER: artemis
  AMQ_PASSWORD: CHANGE_ME
  # Keycloak admin console
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME
