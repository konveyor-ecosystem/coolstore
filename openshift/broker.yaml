apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector: {matchLabels: {app: broker}}
  template:
    metadata: {labels: {app: broker}}
    spec:
      containers:
        - name: artemis
          image: quay.io/artemiscloud/activemq-artemis-broker:1.0.25
          env:
            - {name: AMQ_USER, value: artemis}
            - {name: AMQ_PASSWORD, value: artemis}
          ports: [{containerPort: 5672}]
---
apiVersion: v1
kind: Service
metadata: {name: broker}
spec:
  selector: {app: broker}
  ports: [{name: amqp, port: 5672, targetPort: 5672}]
