# CoolStore on OpenShift — secrets (credentials only).
# Apply before the Deployments (full apply order in CONTAINERIZATION_REPORT.md).
#
# All values are CHANGE_ME placeholders — replace before real use, e.g.:
#   oc create secret generic coolstore-db \
#     --from-literal=QUARKUS_DATASOURCE_USERNAME=... \
#     --from-literal=QUARKUS_DATASOURCE_PASSWORD=...
# (or `oc apply` this file, then `oc set data secret/coolstore-db ...`).
# Prefer an external secret manager (Vault / ESO) for production.
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-db
  namespace: coolstore
  labels:
    app: coolstore-quarkus
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: CHANGE_ME
  QUARKUS_DATASOURCE_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-broker
  namespace: coolstore
  labels:
    app: coolstore-quarkus
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  QUARKUS_ARTEMIS_USERNAME: CHANGE_ME
  QUARKUS_ARTEMIS_PASSWORD: CHANGE_ME
---
# PostgreSQL credentials (database-statefulset.yaml) — keep in sync with
# coolstore-db: the app authenticates to the database with these values.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-creds
  namespace: coolstore
  labels:
    app: postgresql
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  POSTGRES_USER: coolstore
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: coolstore
---
# AMQ Broker credentials (amq-broker.yaml) — keep in sync with coolstore-broker.
apiVersion: v1
kind: Secret
metadata:
  name: amq-creds
  namespace: coolstore
  labels:
    app: amq-broker
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  AMQ_USER: coolstore
  AMQ_PASSWORD: CHANGE_ME
---
# Keycloak bootstrap admin (keycloak.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: coolstore
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
