# CoolStore on OpenShift — external access (edge-terminated TLS; OpenShift
# generates the public hostname automatically). HTTP is redirected to HTTPS.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coolstore
  namespace: coolstore
  labels:
    app: coolstore-quarkus
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: application
spec:
  to:
    kind: Service
    name: coolstore-quarkus
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
