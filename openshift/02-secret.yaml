# Sensitive configuration for the coolstore monolith
# NOTE: placeholder values — replace before applying, or use a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-secrets
  namespace: coolstore
  labels:
    app: coolstore
type: Opaque
stringData:
  DB_USER: "coolstore"
  DB_PASSWORD: "CHANGE_ME_db_password"
