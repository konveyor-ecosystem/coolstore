apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coolstore-quarkus-hpa
  namespace: coolstore-dev
  labels:
    app: coolstore-quarkus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coolstore-quarkus
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
